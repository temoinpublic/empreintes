# A chaque push sur main (le code, ou le journal pousse par l'entrepot dans donnees/) : la gate.
# Le site est servi par vps5 (OVH, D-265) : `empreintes-suivre.timer` y tire la tete de main
# toutes les 2 min, la construit et la met en prod sans coupure. Plus de deploiement Pages ni
# de Worker : le projet Pages reste en secours, sans domaine, et ne doit plus recevoir de version.
name: publier
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publier
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Gate
        run: npm run gate
